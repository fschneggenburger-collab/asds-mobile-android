name: ASDS Mobile Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 35 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Arbeitsordner vorbereiten
        shell: bash
        run: mkdir -p build-artifact

      - name: Release-APK kompilieren
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build-artifact/gradle-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Release-Paket vorbereiten
        if: success()
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifact/ASDS_Mobile_Android_1.3.0_unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" build-artifact/apksigner.jar
          printf 'ASDS Mobile Android 1.3.0\nUnsigned Release APK plus official Android apksigner tool.\n' > build-artifact/README.txt

      - name: Build-Ergebnis bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASDS-Mobile-Android-1.3.0-Build-Ergebnis
          path: build-artifact/
          if-no-files-found: error
          retention-days: 7
