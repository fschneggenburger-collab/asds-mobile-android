name: ASDS Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/BUILD_TRIGGER'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 35 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Arbeitsordner vorbereiten
        shell: bash
        run: mkdir -p build-artifact

      - name: Vollständige Android-Quellen für 1.7.1 vorbereiten
        shell: bash
        run: |
          python3 tools/prepare_mobile.py 1.7.0
          python3 tools/fix_v171.py
          python3 tools/fix_v171_versioncode.py

      - name: Funktionsquellen vor dem Build prüfen
        shell: bash
        run: |
          set -e
          grep -q 'versionCode = 81' app/build.gradle.kts
          grep -q 'versionName = "1.7.1"' app/build.gradle.kts
          grep -q 'ASDSMobile/1.7.1' app/src/main/java/ch/asds/mobile/MainActivity.kt
          grep -q 'showNativeSecurityMenu' app/src/main/java/ch/asds/mobile/MainActivity.kt
          grep -q 'MODE_NIGHT_NO' app/src/main/java/ch/asds/mobile/MainActivity.kt
          grep -q 'ALGORITHMIC_DARKENING' app/src/main/java/ch/asds/mobile/MainActivity.kt
          grep -q 'getBoolean("biometric_enabled", true)' app/src/main/java/ch/asds/mobile/AppSettings.kt
          grep -q 'BiometricPrompt' app/src/main/java/ch/asds/mobile/SecurityController.kt
          grep -q 'PeriodicWorkRequestBuilder' app/src/main/java/ch/asds/mobile/WorkerScheduler.kt
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          {
            echo 'ASDS Mobile 1.7.1 source verification: OK'
            echo 'Version code: 81'
            echo 'Biometric app lock: present and enabled by default'
            echo 'Native security menu: present'
            echo 'Encrypted drafts and sync queue: present'
            echo 'WorkManager notifications: present'
            echo 'Date/time light-mode enforcement: present'
          } > build-artifact/source-verification.txt

      - name: Release-APK kompilieren
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:clean :app:assembleRelease 2>&1 | tee build-artifact/gradle-build-1.7.1.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifact/ASDS_Mobile_Android_1.7.1_unsigned.apk
          fi
          exit "$status"

      - name: Signaturwerkzeug und Hinweise bereitstellen
        if: always()
        shell: bash
        run: |
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" build-artifact/apksigner.jar
          printf 'ASDS Mobile Android 1.7.1\nCorrected security/offline release. Unsigned APK plus official Android apksigner tool.\n' > build-artifact/README.txt

      - name: Build-Ergebnis bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASDS-Mobile-Android-1.7.1-Build-Ergebnis
          path: build-artifact/
          if-no-files-found: error
          retention-days: 7
