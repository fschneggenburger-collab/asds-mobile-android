name: ASDS Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 35 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installierbare Debug-APK kompilieren
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Debug-APK mit apksigner prüfen
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Installierbare Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ASDS-Mobile-Android-1.2.1-Debug-Installierbar
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Unsigned Release-APK kompilieren
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Unsigned Release-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ASDS-Mobile-Android-1.2.1-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
