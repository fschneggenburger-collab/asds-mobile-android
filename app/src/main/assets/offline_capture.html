<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASDS Offline-Erfassung</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17253a;background:#f3f6fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:14px 12px 110px}.card{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.muted{color:#607087;font-size:13px;line-height:1.45}.row{margin:0 0 11px}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bcc8d6;border-radius:9px;background:#fff;color:#17253a;font:inherit}textarea{min-height:86px}.btn{width:100%;border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:#c8a13a;color:#fff}.secondary{background:#e7edf4;color:#17253a}.ok,.warn,.err{padding:10px;border-radius:10px;margin-top:8px}.ok{background:#edf8ef}.warn{background:#fff7e2}.err{background:#fff0f0}.q{border-top:1px solid #e2e8ef;padding:8px 0;font-size:13px}</style></head><body>
<div class="card"><h1>Offline-Erfassung</h1><div class="muted">Diese Seite läuft lokal. Einträge werden verschlüsselt auf dem Gerät gespeichert und bei der nächsten Verbindung synchronisiert.</div><div id="state" class="warn">Lokale Stammdaten werden geladen …</div></div>
<div class="card"><label>Was möchtest du erfassen?</label><select id="kind"><option value="time">Arbeitszeit</option><option value="expense_customer">Kundenspesen</option><option value="expense_business">Geschäftsausgabe</option><option value="trip">Fahrt</option><option value="protocol_draft">Protokollentwurf</option></select></div>
<div class="card"><h2 id="title"></h2><form id="form"></form><div id="note"></div></div>
<div class="card"><h2>Synchronisationswarteschlange</h2><div id="queue"></div><button type="button" class="btn secondary" id="sync">Synchronisation versuchen</button></div>
<script>(function(){'use strict';const B=window.ASDSNative,S=document.getElementById('state'),F=document.getElementById('form'),K=document.getElementById('kind'),T=document.getElementById('title'),N=document.getElementById('note');function call(n,...a){try{return B&&typeof B[n]==='function'?B[n](...a):null}catch(e){return null}}function parse(v,f){try{return JSON.parse(v)}catch(e){return f}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function tm(){let d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}if(!B){S.className='err';S.textContent='ASDS Mobile 1.9.3 oder neuer ist erforderlich.';return}const C=parse(call('getOfflineConfig'),{}),A=Number(call('getOfflineConfigAt')||0);if(C.ok){S.className='ok';S.textContent='Stammdaten lokal verfügbar'+(A?' · vor '+Math.max(0,Math.round((Date.now()-A)/60000))+' Min. aktualisiert':'')+' · Server '+(C.server_version||'')}else{S.textContent='Noch keine lokalen Stammdaten. Einmal mit Internet die ASDS-App öffnen.'}
const defs={time:{title:'Arbeitszeit',fields:[['work_date','Datum','date','',1],['start_time','Von','time','',1],['end_time','Bis','time','',1],['fk_soc','Kunde / Bezug optional','select','customers',0],['block_code','Leistungsblock optional','select','blocks',0],['description','Beschreibung','textarea','',1],['billable','Verrechenbar','check','',0]]},expense_customer:{title:'Kundenspesen',note:'Belegfoto/-PDF kann nach der Synchronisation ergänzt werden.',fields:[['expense_date','Datum','date','',1],['fk_soc','Kunde','select','customers',1],['category','Kategorie','select','expense_categories',1],['label','Titel','text','',1],['amount_ttc','Betrag CHF','number','',1],['vat_rate','MWST %','number','',0],['rebillable','An Kunden weiterverrechnen','check','',0],['description','Beschreibung','textarea','',0]]},expense_business:{title:'Geschäftsausgabe',note:'Belegfoto/-PDF kann nach der Synchronisation ergänzt werden.',fields:[['expense_date','Datum','date','',1],['supplier_name','Lieferant','text','',0],['category','Kategorie','select','business_expense_categories',1],['label','Titel','text','',1],['amount_ttc','Betrag CHF','number','',1],['vat_rate','MWST %','number','',0],['business_share_percent','Geschäftsanteil %','number','',0],['payment_mode','Zahlungsart','payment','',0],['description','Beschreibung','textarea','',0]]},trip:{title:'Fahrt',fields:[['trip_date','Datum','date','',1],['fk_vehicle','Fahrzeug','select','vehicles',1],['trip_type','Zielart','select','trip_types',1],['fk_soc','Kunde / Bezug optional','select','customers',0],['km_start','km Start','number','',1],['km_end','km Ende','number','',1],['start_location','Startort','text','',0],['end_location','Zielort','text','',0],['purpose','Zweck / Notiz','textarea','',0]]},protocol_draft:{title:'Protokollentwurf',fields:[['protocol_date','Datum','date','',1],['fk_soc','Kunde','select','customers',1],['category','Kategorie','select','protocol_categories',0],['title','Titel','text','',1],['summary','Zusammenfassung','textarea','',1],['agreements','Vereinbarungen','textarea','',0],['next_steps','Nächste Schritte','textarea','',0]]}};
function field(f){let[n,l,t,o,r]=f,req=r?' required':'',x='';if(t==='select')x='<select name="'+n+'"'+req+'><option value="">– auswählen –</option>'+((C[o]||[]).map(z=>'<option value="'+esc(z.id!=null?z.id:z.code)+'">'+esc(z.label)+'</option>').join(''))+'</select>';else if(t==='payment')x='<select name="'+n+'"><option value="">– offen –</option><option value="bank">Bank</option><option value="cash">Bar</option><option value="card">Karte</option><option value="private">privat bezahlt</option></select>';else if(t==='textarea')x='<textarea name="'+n+'"'+req+'></textarea>';else if(t==='check')x='<label style="font-weight:400"><input style="width:auto" type="checkbox" name="'+n+'" value="1"'+(n==='rebillable'?' checked':'')+'> '+esc(l)+'</label>';else{x='<input type="'+t+'" name="'+n+'"'+req+(t==='number'?' step="0.01" min="0"':'')+'>';return '<div class="row"><label>'+esc(l)+'</label>'+x+'</div>'}return '<div class="row">'+(t==='check'?'':'<label>'+esc(l)+'</label>')+x+'</div>'}
function render(){let d=defs[K.value];T.textContent=d.title;F.innerHTML=d.fields.map(field).join('')+'<button class="btn">Offline speichern</button>';N.innerHTML=d.note?'<div class="warn">'+esc(d.note)+'</div>':'';F.querySelectorAll('input[type=date]').forEach(x=>x.value=today());let tt=F.querySelectorAll('input[type=time]');tt.forEach(x=>x.value=tm());let bs=F.querySelector('[name=business_share_percent]');if(bs)bs.value='100';let vat=F.querySelector('[name=vat_rate]');if(vat)vat.value='0'}K.onchange=render;render();
function payload(){let o={};new FormData(F).forEach((v,k)=>o[k]=v);F.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked?1:0);return o}function qid(k){return'off-'+k+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}function queue(){let q=parse(call('listQueue'),[]);document.getElementById('queue').innerHTML=q.length?q.map(x=>'<div class="q"><b>'+esc(x.label||'Offline-Eintrag')+'</b><br><span class="muted">'+esc(x.createdAtLabel||'wartet')+' · '+esc(x.state||'pending')+'</span></div>').join(''):'<div class="ok">Keine offenen Offline-Einträge.</div>'}F.onsubmit=e=>{e.preventDefault();if(!F.reportValidity())return;let k=K.value,id=qid(k),url=C.sync_url||'https://portal.ihre-wegbegleiterin.ch/custom/asds_mobile/mobile/offline_sync.php?stage=10',body='client_id='+encodeURIComponent(id)+'&kind='+encodeURIComponent(k)+'&payload='+encodeURIComponent(JSON.stringify(payload())),r=call('enqueueForm',url,'POST',body,'Offline-'+defs[k].title,'offline:'+id);if(!r){alert('Offline-Eintrag konnte nicht gespeichert werden.');return}alert('Offline gespeichert. Synchronisation erfolgt automatisch bei Verbindung.');render();queue()};document.getElementById('sync').onclick=()=>{call('retrySync');queue()};queue();setInterval(queue,4000)})();</script></body></html>
