<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASDS Offline-Erfassung</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17253a;background:#f3f6fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:14px 12px 110px}.card{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.muted{color:#607087;font-size:13px;line-height:1.45}.row{margin:0 0 11px}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bcc8d6;border-radius:9px;background:#fff;color:#17253a;font:inherit}textarea{min-height:86px}.btn{width:100%;border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:#c8a13a;color:#fff}.secondary{background:#e7edf4;color:#17253a}.ok,.warn,.err{padding:10px;border-radius:10px;margin-top:8px}.ok{background:#edf8ef}.warn{background:#fff7e2}.err{background:#fff0f0}.q{border-top:1px solid #e2e8ef;padding:8px 0;font-size:13px}.dt-offline{border:1px solid #d6e1ec;border-radius:10px;padding:11px;margin:8px 0 13px;background:#f7fafc}.dt-offline input,.dt-offline select{margin:5px 0}.dt-offline .dt-fav{font-weight:400;display:flex;align-items:center;gap:7px}.dt-offline .dt-fav input{width:auto}.dt-line{display:flex;gap:8px;justify-content:space-between;align-items:center;border-bottom:1px solid #e0e7ed;padding:9px 0}.dt-line b,.dt-line small,.dt-line span{display:block}.dt-line small{color:#657486}.dt-line span{font-size:12px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;max-height:36px;overflow:hidden}.dt-line button{border:0;border-radius:8px;padding:8px 9px;min-width:80px}.dt-offline details{margin-top:12px}.dt-offline details summary{font-weight:700;cursor:pointer}.dt-offline details small{display:block;color:#657486;margin-top:5px}
</style></head><body>
<div class="card"><h1>Offline-Erfassung</h1><div class="muted">Diese Seite läuft lokal. Einträge und Belege werden verschlüsselt auf dem Gerät gespeichert und bei der nächsten Verbindung synchronisiert.</div><div id="state" class="warn">Lokale Stammdaten werden geladen …</div></div>
<div class="card"><label>Was möchtest du erfassen?</label><select id="kind"><option value="time">Arbeitszeit</option><option value="expense_customer">Kundenspesen</option><option value="expense_business">Geschäftsausgabe</option><option value="trip">Fahrt</option><option value="protocol_draft">Protokollentwurf</option></select></div>
<div class="card"><h2 id="title"></h2><form id="form"></form><div id="note"></div></div>
<div class="card"><h2>Synchronisationswarteschlange</h2><div id="queue"></div><button type="button" class="btn secondary" id="sync">Synchronisation versuchen</button></div>
<script src="offline_time_202.js"></script>
<script>(function(){'use strict';const B=window.ASDSNative,S=document.getElementById('state'),F=document.getElementById('form'),K=document.getElementById('kind'),T=document.getElementById('title'),N=document.getElementById('note');function call(n,...a){try{return B&&typeof B[n]==='function'?B[n](...a):null}catch(e){return null}}function parse(v,f){try{return JSON.parse(v)}catch(e){return f}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function tm(){let d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}if(!B){S.className='err';S.textContent='ASDS Mobile 1.9.3 oder neuer ist erforderlich.';return}const C=parse(call('getOfflineConfig'),{}),A=Number(call('getOfflineConfigAt')||0);if(C.ok){S.className='ok';S.textContent='Stammdaten lokal verfügbar'+(A?' · vor '+Math.max(0,Math.round((Date.now()-A)/60000))+' Min. aktualisiert':'')+' · Server '+(C.server_version||'')}else{S.textContent='Noch keine lokalen Stammdaten. Einmal mit Internet die ASDS-App öffnen.'}
const defs={time:{title:'Arbeitszeit',fields:[['work_date','Datum','date','',1],['start_time','Von','time','',1],['end_time','Bis','time','',1],['fk_soc','Kunde / Bezug','select','customers',1],['block_code','Leistungsblock optional','select','blocks',0],['description','Beschreibung','textarea','',1],['billable_km','Abrechenbare Kilometer','number','',1],['km_rate','Kilometeransatz CHF/km','number','',1],['appointment_id','Terminverknüpfung (optional)','select','appointments',0],['billable','Verrechenbar','check','',0]]},expense_customer:{title:'Kundenspesen',note:'Belegfoto oder PDF kann direkt offline mitgespeichert werden. Fotos werden vor dem Speichern platzsparend optimiert.',fields:[['expense_date','Datum','date','',1],['fk_soc','Kunde','select','customers',1],['category','Kategorie','select','expense_categories',1],['label','Titel','text','',1],['amount_ttc','Betrag CHF','number','',1],['vat_rate','MWST %','number','',0],['rebillable','An Kunden weiterverrechnen','check','',0],['description','Beschreibung','textarea','',0],['receipt','Belegfoto / PDF optional','file','',0]]},expense_business:{title:'Geschäftsausgabe',note:'Belegfoto oder PDF kann direkt offline mitgespeichert werden. Fotos werden vor dem Speichern platzsparend optimiert.',fields:[['expense_date','Datum','date','',1],['supplier_name','Lieferant','text','',0],['category','Kategorie','select','business_expense_categories',1],['label','Titel','text','',1],['amount_ttc','Betrag CHF','number','',1],['vat_rate','MWST %','number','',0],['business_share_percent','Geschäftsanteil %','number','',0],['payment_mode','Zahlungsart','payment','',0],['description','Beschreibung','textarea','',0],['receipt','Belegfoto / PDF optional','file','',0]]},trip:{title:'Fahrt',fields:[['trip_date','Datum','date','',1],['fk_vehicle','Fahrzeug','select','vehicles',1],['trip_type','Zielart','select','trip_types',1],['fk_soc','Kunde / Bezug optional','select','customers',0],['km_start','km Start','number','',1],['km_end','km Ende','number','',1],['start_location','Startort','text','',0],['end_location','Zielort','text','',0],['purpose','Zweck / Notiz','textarea','',0]]},protocol_draft:{title:'Protokollentwurf',fields:[['protocol_date','Datum','date','',1],['fk_soc','Kunde','select','customers',1],['category','Kategorie','select','protocol_categories',0],['title','Titel','text','',1],['summary','Zusammenfassung','textarea','',1],['agreements','Vereinbarungen','textarea','',0],['next_steps','Nächste Schritte','textarea','',0]]}};
function field(f){let[n,l,t,o,r]=f,req=r?' required':'',x='';if(t==='select')x='<select name="'+n+'"'+req+'><option value="">– auswählen –</option>'+((C[o]||[]).map(z=>'<option value="'+esc(z.id!=null?z.id:z.code)+'">'+esc(z.label)+'</option>').join(''))+'</select>';else if(t==='payment')x='<select name="'+n+'"><option value="">– offen –</option><option value="bank">Bank</option><option value="cash">Bar</option><option value="card">Karte</option><option value="private">privat bezahlt</option></select>';else if(t==='textarea')x='<textarea name="'+n+'"'+req+'></textarea>';else if(t==='check')x='<label style="font-weight:400"><input style="width:auto" type="checkbox" name="'+n+'" value="1"'+(n==='rebillable'||n==='billable'?' checked':'')+'> '+esc(l)+'</label>';else if(t==='file')x='<input type="file" name="'+n+'" accept="image/*,application/pdf">';else{x='<input type="'+t+'" name="'+n+'"'+req+(t==='number'?' step="0.01" min="0"':'')+'>';return '<div class="row"><label>'+esc(l)+'</label>'+x+'</div>'}return '<div class="row">'+(t==='check'?'':'<label>'+esc(l)+'</label>')+x+'</div>'}
const DT=Array.isArray(C.description_templates)?C.description_templates.slice():[];
function descriptionPicker(){const cats=Array.isArray(C.description_categories)?C.description_categories:[];return '<div class="dt-offline"><label>Textbausteine für die Beschreibung</label><input id="dt-search" type="search" placeholder="Satz suchen: Arzt, Einkaufen …" aria-label="Textbausteine suchen"><select id="dt-category" aria-label="Textbaustein-Kategorie"><option value="">Alle Kategorien</option>'+cats.map(c=>'<option value="'+Number(c.id)+'">'+esc(c.label)+'</option>').join('')+'</select><label class="dt-fav"><input id="dt-favs" type="checkbox"> Nur Favoriten</label><div id="dt-results" aria-live="polite"></div><details><summary>Beschreibung als neue Vorlage speichern</summary><input id="dt-new-label" maxlength="180" placeholder="Bezeichnung des neuen Bausteins" aria-label="Bezeichnung"><select id="dt-new-category"><option value="0">Ohne Kategorie</option>'+cats.map(c=>'<option value="'+Number(c.id)+'">'+esc(c.label)+'</option>').join('')+'</select><button class="btn secondary" id="dt-save" type="button">Persönliche Vorlage vormerken</button><small>Wird verschlüsselt vorgemerkt und bei Internetverbindung synchronisiert.</small></details></div>'}
function renderDescriptions(){let box=document.getElementById('dt-results');if(!box)return;let q=String(document.getElementById('dt-search').value||'').trim().toLocaleLowerCase('de-CH'),cat=document.getElementById('dt-category').value,only=document.getElementById('dt-favs').checked;let list=DT.map((t,i)=>({t,i})).filter(x=>x.t.active!==0&&x.t.active!=='0'&&(!cat||String(x.t.category_id)===cat)&&(!only||x.t.favorite)&&(!q||(String(x.t.label||'')+' '+String(x.t.body||'')+' '+String(x.t.category||'')).toLocaleLowerCase('de-CH').includes(q))).slice(0,30);box.innerHTML=list.length?list.map(x=>'<div class="dt-line"><div><b>'+esc(x.t.label)+'</b><small>'+esc(x.t.category||'Ohne Kategorie')+(x.t.favorite?' · ★':'')+'</small><span>'+esc(String(x.t.body||'').slice(0,190))+'</span></div><button type="button" class="secondary" data-dt="'+x.i+'">Einfügen</button></div>').join(''):'<p class="muted">Keine passenden Vorlagen im lokalen Bestand.</p>';box.querySelectorAll('[data-dt]').forEach(button=>button.onclick=()=>{let t=DT[Number(button.dataset.dt)],field=F.elements.namedItem('description');if(!t||!field)return;field.value=(field.value.trimEnd()?field.value.trimEnd()+String.fromCharCode(10):'')+String(t.body||'');field.dispatchEvent(new Event('input',{bubbles:true}));field.focus()})}
function setupDescriptions(){if(K.value!=='time')return;document.getElementById('dt-search').addEventListener('input',renderDescriptions);document.getElementById('dt-category').addEventListener('change',renderDescriptions);document.getElementById('dt-favs').addEventListener('change',renderDescriptions);document.getElementById('dt-save').onclick=()=>{let label=document.getElementById('dt-new-label').value.trim(),categoryId=Number(document.getElementById('dt-new-category').value)||0,field=F.elements.namedItem('description'),body=field?field.value.trim():'';if(!label||!body){alert('Bitte zuerst eine Beschreibung eingeben und eine Bezeichnung wählen.');return}if(body.length>6000){alert('Die Vorlage darf höchstens 6000 Zeichen enthalten.');return}const payload={label,body,category_id:categoryId},id=qid('description_template'),url=C.sync_url||'https://portal.ihre-wegbegleiterin.ch/custom/asds_mobile/mobile/offline_sync.php?stage=10',form='client_id='+encodeURIComponent(id)+'&kind=description_template&payload='+encodeURIComponent(JSON.stringify(payload)),result=call('enqueueForm',url,'POST',form,'Textbaustein: '+label,'offline:'+id);if(!result){alert('Offline-Warteschlange konnte nicht beschrieben werden.');return}let category=(C.description_categories||[]).find(c=>Number(c.id)===categoryId);DT.unshift({id:-Date.now(),label,body,category_id:categoryId,category:category?category.label:'',scope:'personal',active:1,favorite:0});document.getElementById('dt-new-label').value='';document.getElementById('dt-search').value='';renderDescriptions();queue();alert('Baustein für die Synchronisation vorgemerkt. Bis dahin ist er in dieser Offline-Sitzung auswählbar.')};renderDescriptions()}
function timePreview(){if(K.value!=='time')return;let out=document.getElementById('km-preview'),km=F.elements.namedItem('billable_km'),rate=F.elements.namedItem('km_rate');if(!out||!km||!rate)return;try{out.textContent='Zusätzlicher Kilometerbetrag: CHF '+ASDSOfflineTimeV202.calculate(km.value,rate.value).km_amount;out.className='ok'}catch(err){out.textContent=err.message;out.className='warn'}}
function appointmentOptions(){if(K.value!=='time')return;let select=F.elements.namedItem('appointment_id'),customer=F.elements.namedItem('fk_soc');if(!select)return;let old=select.value;select.innerHTML='<option value="">– keine Verknüpfung –</option>';ASDSOfflineTimeV202.matchingAppointments(customer?customer.value:'',C.appointments).forEach(a=>{let option=document.createElement('option');option.value=String(a.id||a.appointment_id);option.textContent=(a.start_at?String(a.start_at).slice(0,16).replace('T',' ')+' · ':'')+String(a.label||'Termin #'+option.value);select.appendChild(option)});if(Array.from(select.options).some(o=>o.value===old))select.value=old}
function render(){let d=defs[K.value];T.textContent=d.title;F.innerHTML=d.fields.map(f=>field(f)+(K.value==='time'&&f[0]==='description'?descriptionPicker():'')).join('')+(K.value==='time'?'<div id="km-preview" role="status" aria-live="polite" class="ok"></div>':'')+'<button class="btn">Offline speichern</button>';N.innerHTML=d.note?'<div class="warn">'+esc(d.note)+'</div>':'';F.querySelectorAll('input[type=date]').forEach(x=>x.value=today());F.querySelectorAll('input[type=time]').forEach(x=>x.value=tm());let bs=F.querySelector('[name=business_share_percent]');if(bs)bs.value='100';let vat=F.querySelector('[name=vat_rate]');if(vat)vat.value='0';if(K.value==='time'){let km=F.elements.namedItem('billable_km'),rate=F.elements.namedItem('km_rate'),cust=F.elements.namedItem('fk_soc');km.value='0.00';rate.value=(C.default_km_rate==null?'0.70':String(C.default_km_rate)).replace(',','.');appointmentOptions();setupDescriptions();km.addEventListener('input',timePreview);rate.addEventListener('input',timePreview);if(cust)cust.addEventListener('change',appointmentOptions);timePreview();if(!ASDSOfflineTimeV202.isExtendedServer(C))N.innerHTML='<div class="warn">Offline speichern ist möglich. Der installierte Server hat die Kilometer-/Terminübertragung noch nicht als kompatibel bestätigt. Ohne hinterlegten Standardansatz wird vorläufig CHF 0.70/km angezeigt; bitte den korrekten Satz prüfen. Betroffene Einträge bleiben in der Warteschlange, bis die Server-Konfiguration aktualisiert ist.</div>'}}K.onchange=render;render();
function rawPayload(){let o={};new FormData(F).forEach((v,k)=>{if(!(v instanceof File))o[k]=v});F.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked?1:0);return o}function dataUrl(file){return new Promise((ok,bad)=>{let r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=bad;r.readAsDataURL(file)})}async function receipt(){let i=F.querySelector('input[name=receipt]'),file=i&&i.files&&i.files[0];if(!file)return null;if(file.type==='application/pdf'){if(file.size>2500000)throw new Error('PDF ist für die Offline-Warteschlange zu gross (max. 2.5 MB).');return{name:file.name||'Beleg.pdf',type:'application/pdf',data:await dataUrl(file)}}if(!file.type.startsWith('image/'))throw new Error('Nur Bild oder PDF erlaubt.');if(file.size>16000000)throw new Error('Bild ist zu gross.');let src=await dataUrl(file);return await new Promise((ok,bad)=>{let im=new Image();im.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({name:'Beleg_'+Date.now()+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',0.76)})};im.onerror=bad;im.src=src})}async function payload(){let o=rawPayload(),r=await receipt();if(r)o.receipt=r;return o}function qid(k){return'off-'+k+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}function queue(){let q=parse(call('listQueue'),[]);document.getElementById('queue').innerHTML=q.length?q.map(x=>'<div class="q"><b>'+esc(x.label||'Offline-Eintrag')+'</b><br><span class="muted">'+esc(x.createdAtLabel||'wartet')+' · '+esc(x.state||'pending')+'</span></div>').join(''):'<div class="ok">Keine offenen Offline-Einträge.</div>'}
F.onsubmit=async e=>{e.preventDefault();if(!F.reportValidity())return;let button=F.querySelector('button');button.disabled=true;button.textContent='Wird lokal gespeichert …';try{let k=K.value,id=qid(k),data=await payload();if(k==='time'){data=ASDSOfflineTimeV202.buildTimePayload(data,C.appointments).data}let url=C.sync_url||'https://portal.ihre-wegbegleiterin.ch/custom/asds_mobile/mobile/offline_sync.php?stage=10',body='client_id='+encodeURIComponent(id)+'&kind='+encodeURIComponent(k)+'&payload='+encodeURIComponent(JSON.stringify(data)),r=call('enqueueForm',url,'POST',body,'Offline-'+defs[k].title,'offline:'+id);if(!r)throw new Error('Lokale Warteschlange nicht verfügbar.');alert('Offline gespeichert. Synchronisation erfolgt automatisch bei Verbindung.');render();queue()}catch(err){alert('Speichern fehlgeschlagen: '+(err&&err.message?err.message:err))}finally{let b=F.querySelector('button');if(b){b.disabled=false;b.textContent='Offline speichern'}}};document.getElementById('sync').onclick=()=>{call('retrySync');queue()};queue();setInterval(queue,4000)})();</script></body></html>
